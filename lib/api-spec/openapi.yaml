openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: radar
    description: RadarOH persistence and migration operations
  - name: radar-ai
    description: Evidence-grounded RadarOH AI analysis and alerts
  - name: radar-analytics
    description: Executive intelligence dashboards, search and exports
  - name: radar-integrations
    description: Authorized integration registry, webhooks and delivery observability
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /radar/state:
    get:
      operationId: getRadarState
      tags: [radar]
      summary: Read the RadarOH workspace
      responses:
        "200":
          description: Current normalized workspace state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarState"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      operationId: replaceRadarState
      tags: [radar]
      summary: Replace the normalized RadarOH workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadarStateInput"
      responses:
        "200":
          description: Persisted normalized workspace state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarState"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
  /radar/import:
    post:
      operationId: importRadarData
      tags: [radar]
      summary: Import and preserve a RadarOH JSON snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadarImportRequest"
      responses:
        "201":
          description: Imported and validated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarImportResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
  /radar/sources:
    post:
      operationId: createRadarSource
      tags: [radar]
      summary: Create a source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadarSourceInput"
      responses:
        "201":
          description: Created source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarSource"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
  /radar/sources/{id}:
    patch:
      operationId: updateRadarSource
      tags: [radar]
      summary: Update a source
      parameters:
        - $ref: "#/components/parameters/RadarId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadarSourceUpdate"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarSource"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: deleteRadarSource
      tags: [radar]
      summary: Delete a source
      parameters:
        - $ref: "#/components/parameters/RadarId"
      responses:
        "204":
          description: Source deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /radar/competitors:
    post:
      operationId: createRadarCompetitor
      tags: [radar]
      summary: Create a competitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadarCompetitorInput"
      responses:
        "201":
          description: Created competitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarCompetitor"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
  /radar/competitors/{id}:
    patch:
      operationId: updateRadarCompetitor
      tags: [radar]
      summary: Update a competitor
      parameters:
        - $ref: "#/components/parameters/RadarId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadarCompetitorUpdate"
      responses:
        "200":
          description: Updated competitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarCompetitor"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: deleteRadarCompetitor
      tags: [radar]
      summary: Delete a competitor
      parameters:
        - $ref: "#/components/parameters/RadarId"
      responses:
        "204":
          description: Competitor deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /radar/keywords:
    post:
      operationId: createRadarKeyword
      tags: [radar]
      summary: Create a keyword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadarKeywordInput"
      responses:
        "201":
          description: Created keyword
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarKeyword"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
  /radar/keywords/{id}:
    patch:
      operationId: updateRadarKeyword
      tags: [radar]
      summary: Update a keyword
      parameters:
        - $ref: "#/components/parameters/RadarId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadarKeywordUpdate"
      responses:
        "200":
          description: Updated keyword
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarKeyword"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: deleteRadarKeyword
      tags: [radar]
      summary: Delete a keyword
      parameters:
        - $ref: "#/components/parameters/RadarId"
      responses:
        "204":
          description: Keyword deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /radar/monitor/status:
    get:
      operationId: getRadarMonitorStatus
      tags: [radar]
      summary: Read monitoring status, recent runs and changes
      responses:
        "200":
          description: Current monitor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarMonitorStatus"
        "500":
          $ref: "#/components/responses/ServerError"
  /radar/monitor/run:
    post:
      operationId: runRadarMonitor
      tags: [radar]
      summary: Run one source or all configured sources now
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadarMonitorRunRequest"
      responses:
        "200":
          description: Monitor execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarMonitorRunResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /radar/monitor/history:
    get:
      operationId: getRadarMonitorHistory
      tags: [radar]
      summary: Read change history, optionally filtered by competitor
      parameters:
        - name: competitor_id
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: number, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Change events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RadarChangeEvent" }
        "500":
          $ref: "#/components/responses/ServerError"
  /radar/ai/status:
    get:
      operationId: getRadarAiStatus
      tags: [radar-ai]
      summary: Read the latest AI insights and alert count
      responses:
        "200":
          description: Latest AI status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarAiStatus"
  /radar/ai/analyze:
    post:
      operationId: runRadarAiAnalysis
      tags: [radar-ai]
      summary: Analyze stored RadarOH evidence with AI
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadarAiAnalysisRequest"
      responses:
        "200":
          description: Completed evidence-grounded analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarAiAnalysisResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
  /radar/ai/analyses:
    get:
      operationId: listRadarAiAnalyses
      tags: [radar-ai]
      summary: List previous AI analyses
      responses:
        "200":
          description: AI analysis history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RadarAiAnalysis"
  /radar/ai/alerts:
    get:
      operationId: listRadarAiAlerts
      tags: [radar-ai]
      summary: List AI alerts
      responses:
        "200":
          description: AI alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RadarAiAlert"
  /radar/ai/alerts/{id}:
    patch:
      operationId: updateRadarAiAlert
      tags: [radar-ai]
      summary: Mark an AI alert as read or unread
      parameters:
        - $ref: "#/components/parameters/RadarId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadarAiAlertUpdate"
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarAiAlert"
        "404":
          $ref: "#/components/responses/NotFound"
  /radar/executive:
    get:
      operationId: getRadarExecutiveDashboard
      tags: [radar-analytics]
      summary: Read aggregated executive intelligence metrics
      parameters:
        - { name: competitor_id, in: query, required: false, schema: { type: string } }
        - { name: source_id, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: priority, in: query, required: false, schema: { type: string, enum: [low, medium, high, critical] } }
        - { name: event_type, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Executive dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarExecutiveDashboard" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /radar/intelligence:
    get:
      operationId: getRadarIntelligence
      tags: [radar-analytics]
      summary: Read evidence-backed scores, trends, recommendations and quality metrics
      parameters:
        - { name: days, in: query, required: false, schema: { type: number, minimum: 30, maximum: 366, default: 90 } }
      responses:
        "200":
          description: Advanced intelligence derived from persisted RadarOH evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarIntelligence" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /radar/integrations/overview:
    get:
      operationId: getRadarIntegrationsOverview
      tags: [radar-integrations]
      summary: Read the integration control plane and department dashboard catalog
      responses:
        "200":
          description: Integration registry, webhook health, delivery metrics and departments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarIntegrationsOverview" }
  /radar/integrations:
    post:
      operationId: registerRadarIntegration
      tags: [radar-integrations]
      summary: Register an external system for documented authorization review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RadarIntegrationRegistration" }
      responses:
        "201":
          description: Registered integration, always pending authorization initially
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarIntegration" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /radar/integrations/{id}:
    patch:
      operationId: updateRadarIntegration
      tags: [radar-integrations]
      summary: Update authorization metadata or pause an integration
      parameters:
        - $ref: "#/components/parameters/RadarId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RadarIntegrationUpdate" }
      responses:
        "200":
          description: Updated integration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarIntegration" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /radar/integrations/{id}/webhooks:
    post:
      operationId: createRadarWebhookSubscription
      tags: [radar-integrations]
      summary: Register a paused webhook subscription
      parameters:
        - $ref: "#/components/parameters/RadarId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RadarWebhookRegistration" }
      responses:
        "201":
          description: Paused webhook subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarWebhookSubscription" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /radar/integrations/deliveries:
    get:
      operationId: listRadarIntegrationDeliveries
      tags: [radar-integrations]
      summary: Read webhook delivery attempts and recovery state
      responses:
        "200":
          description: Recent deliveries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RadarIntegrationDelivery" }
  /radar/integrations/deliveries/{id}/retry:
    post:
      operationId: retryRadarIntegrationDelivery
      tags: [radar-integrations]
      summary: Queue a failed delivery for a later authorized retry
      parameters:
        - $ref: "#/components/parameters/RadarId"
      responses:
        "200":
          description: Delivery queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarIntegrationDelivery" }
        "404": { $ref: "#/components/responses/NotFound" }
  /radar/search:
    get:
      operationId: searchRadar
      tags: [radar-analytics]
      summary: Search across RadarOH entities and evidence
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 160 } }
      responses:
        "200":
          description: Global search results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarSearchResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /radar/reports/export:
    get:
      operationId: exportRadarExecutiveReport
      tags: [radar-analytics]
      summary: Export a filtered executive report as CSV
      parameters:
        - { name: competitor_id, in: query, required: false, schema: { type: string } }
        - { name: source_id, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: priority, in: query, required: false, schema: { type: string, enum: [low, medium, high, critical] } }
        - { name: event_type, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: CSV report
          content:
            text/csv: {}
        "400": { $ref: "#/components/responses/ValidationError" }
  /radar/alert-preferences:
    get:
      operationId: getRadarAlertPreferences
      tags: [radar-analytics]
      summary: Read configurable alert thresholds
      responses:
        "200":
          description: Alert preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarAlertPreferences" }
    patch:
      operationId: updateRadarAlertPreferences
      tags: [radar-analytics]
      summary: Update configurable alert thresholds
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RadarAlertPreferencesUpdate" }
      responses:
        "200":
          description: Updated alert preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarAlertPreferences" }
components:
  parameters:
    RadarId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    RadarSource:
      type: object
      additionalProperties: true
      required: [id, termino, tipo, frecuencia, notas, connector, endpoint_url, enabled, competitor_id, last_status, last_error, consecutive_failures]
      properties:
        id: { type: string }
        termino: { type: string }
        tipo: { type: string }
        frecuencia: { type: string }
        notas: { type: string }
        connector: { type: string, enum: [manual, rss, json_api, web] }
        endpoint_url: { type: string }
        enabled: { type: boolean }
        competitor_id: { type: string, nullable: true }
        last_run_at: { type: string, nullable: true }
        next_run_at: { type: string, nullable: true }
        last_status: { type: string, enum: [idle, running, success, error] }
        last_error: { type: string }
        consecutive_failures: { type: number, minimum: 0 }
    RadarSourceInput:
      type: object
      additionalProperties: true
      required: [termino, tipo, frecuencia, notas]
      properties:
        id: { type: string }
        termino: { type: string }
        tipo: { type: string }
        frecuencia: { type: string }
        notas: { type: string }
        connector: { type: string, enum: [manual, rss, json_api, web] }
        endpoint_url: { type: string }
        enabled: { type: boolean }
        competitor_id: { type: string, nullable: true }
    RadarSourceUpdate:
      type: object
      additionalProperties: true
      properties:
        termino: { type: string }
        tipo: { type: string }
        frecuencia: { type: string }
        notas: { type: string }
        connector: { type: string, enum: [manual, rss, json_api, web] }
        endpoint_url: { type: string }
        enabled: { type: boolean }
        competitor_id: { type: string, nullable: true }
    RadarCompetitor:
      type: object
      additionalProperties: true
      required: [id, nombre, ubicacion, especialidad, rango_precio, web, redes, fortalezas, debilidades, notas, prioridad, estado]
      properties:
        id: { type: string }
        nombre: { type: string }
        ubicacion: { type: string }
        especialidad: { type: string }
        rango_precio: { type: string }
        web: { type: string }
        redes: { type: string }
        fortalezas: { type: string }
        debilidades: { type: string }
        notas: { type: string }
        prioridad: { type: string }
        estado: { type: string }
    RadarCompetitorInput:
      type: object
      additionalProperties: true
      required: [nombre, ubicacion, especialidad, rango_precio, web, redes, fortalezas, debilidades, notas, prioridad, estado]
      properties:
        id: { type: string }
        nombre: { type: string }
        ubicacion: { type: string }
        especialidad: { type: string }
        rango_precio: { type: string }
        web: { type: string }
        redes: { type: string }
        fortalezas: { type: string }
        debilidades: { type: string }
        notas: { type: string }
        prioridad: { type: string }
        estado: { type: string }
    RadarCompetitorUpdate:
      type: object
      additionalProperties: true
      properties:
        nombre: { type: string }
        ubicacion: { type: string }
        especialidad: { type: string }
        rango_precio: { type: string }
        web: { type: string }
        redes: { type: string }
        fortalezas: { type: string }
        debilidades: { type: string }
        notas: { type: string }
        prioridad: { type: string }
        estado: { type: string }
    RadarKeyword:
      type: object
      additionalProperties: true
      required: [id, termino, volumen, posicion, notas]
      properties:
        id: { type: string }
        termino: { type: string }
        volumen: { type: string }
        posicion: { type: string }
        notas: { type: string }
    RadarKeywordInput:
      type: object
      additionalProperties: true
      required: [termino, volumen, posicion, notas]
      properties:
        id: { type: string }
        termino: { type: string }
        volumen: { type: string }
        posicion: { type: string }
        notas: { type: string }
    RadarKeywordUpdate:
      type: object
      additionalProperties: true
      properties:
        termino: { type: string }
        volumen: { type: string }
        posicion: { type: string }
        notas: { type: string }
    RadarPlanItem:
      type: object
      additionalProperties: true
      required: [id, text, done]
      properties:
        id: { type: string }
        text: { type: string }
        done: { type: boolean }
    RadarPlan:
      type: object
      required: ["30", "60", "90"]
      properties:
        "30":
          type: array
          items: { $ref: "#/components/schemas/RadarPlanItem" }
        "60":
          type: array
          items: { $ref: "#/components/schemas/RadarPlanItem" }
        "90":
          type: array
          items: { $ref: "#/components/schemas/RadarPlanItem" }
    RadarState:
      type: object
      required: [workspaceId, sources, competitors, keywords, plan]
      properties:
        workspaceId: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/RadarSource" }
        competitors:
          type: array
          items: { $ref: "#/components/schemas/RadarCompetitor" }
        keywords:
          type: array
          items: { $ref: "#/components/schemas/RadarKeyword" }
        plan:
          $ref: "#/components/schemas/RadarPlan"
    RadarStateInput:
      type: object
      required: [sources, competitors, keywords, plan]
      properties:
        sources:
          type: array
          items: { $ref: "#/components/schemas/RadarSourceInput" }
        competitors:
          type: array
          items: { $ref: "#/components/schemas/RadarCompetitorInput" }
        keywords:
          type: array
          items: { $ref: "#/components/schemas/RadarKeywordInput" }
        plan:
